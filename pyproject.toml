[project]
name = "llamactl"
version = "0.1.0"
description = "Textual TUI for launching and managing llama.cpp servers"
requires-python = ">=3.11"
dependencies = ["textual>=8.0", "httpx>=0.28"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
llamactl = "llamactl.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["llamactl"]
